name: Deploy to Oderland
# Samma strömbrytare som för texsolv.se: repovariabeln LIVE (Settings > Secrets and variables > Actions > Variables).
#
#   Alltid:                  staging -> testdomänens mapp (testbygge med noindex; mappen är Document Root för
#                                       long-black-anaconda.46-16-236-12.cpanel.site i cPanel)
#   LIVE saknas/false (nu):  main    -> laddas inte upp alls (public_html/ rörs inte – där ligger gamla runlock.se)
#   LIVE = true (lansering): main    -> public_html/  (lanseringsbygge: sitemap, robots, .htaccess med https och utan www)
#
# runlock.se har ett eget Oderland-konto (server 46.16.236.12). FTP-kontot i det kontots cPanel ska ha Directory = kontots
# hemmapp (rot), katalogerna ovan anges relativt den. Uppgifterna ligger i Secrets: FTP_SERVER (IP-numret), FTP_USERNAME, FTP_PASSWORD.
on:
  push:
    branches: [main, staging]
    paths: ["site/**", "tools/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
env:
  STAGE_DIR: long-black-anaconda.46-16-236-12.cpanel.site/
  LIVE_DIR: public_html/
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main' || vars.LIVE == 'true'
    env:
      MODE: ${{ (github.ref_name == 'main' && vars.LIVE == 'true') && 'live' || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (stage = noindex, live = sitemap + .htaccess)
        run: |
          python tools/build.py "$MODE"
          if [ "$MODE" = "live" ]; then echo "SERVER_DIR=$LIVE_DIR" >> "$GITHUB_ENV"; else echo "SERVER_DIR=$STAGE_DIR" >> "$GITHUB_ENV"; fi
      - name: Show target
        run: |
          echo "Target: $SERVER_DIR ($MODE)"
      - name: Upload changed files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_build/
          server-dir: ${{ env.SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/Thumbs.db
